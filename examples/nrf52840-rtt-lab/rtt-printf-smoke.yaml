# LabWired - nRF52840 SEGGER RTT printf demo smoke
schema_version: "1.0"
inputs:
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nrf52840-rtt-demo"
  system: "./system.yaml"
limits:
  max_steps: 500000
assertions:
  - rtt_contains: "Hello World from SEGGER!"
  - rtt_contains: "Counter:"
  # The green SGR escape sits between "Counter: " and the digit, so the needle
  # has to carry it; this is what proves the counter advanced past 0.
  - rtt_contains: "Counter: \u001B[1;32m1"
  - expected_stop_reason: max_steps
