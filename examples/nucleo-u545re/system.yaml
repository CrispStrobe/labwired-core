# LabWired - NUCLEO-U545RE-Q example system configuration.
# Same board IO as configs/systems/nucleo-u545re.yaml; kept as its own file so
# the example is self-contained and strict_onboarding can find the chip.
name: "nucleo-u545re-example"
chip: "../../configs/chips/stm32u545.yaml"
debug_uart: "usart1"
external_devices: []
board_io:
  - id: "led_green_ld2"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
  - id: "button_user_pc13"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: true
