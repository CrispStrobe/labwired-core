schema_version: "1.0"
# Same clockbug image on the clock-gating-stripped chip. The USART clock bit is
# set in the image, so BENCH_UART_OK prints here too.
inputs:
  system: "./system-nogate.yaml"
  firmware: "./firmware/build/clockbug.elf"
limits:
  max_steps: 200000
assertions:
  - uart_contains: "BENCH_UART_OK"
  - expected_stop_reason: max_steps
