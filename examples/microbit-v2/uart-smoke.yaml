# LabWired - micro:bit v2 UART smoke
schema_version: "1.0"
inputs:
  # Built by: cargo build -p firmware-nrf52833-demo --release --target thumbv7em-none-eabi
  # Survival fixture (same bytes): tests/fixtures/microbit-v2-smoke.elf
  firmware: "../../target/thumbv7em-none-eabi/release/firmware-nrf52833-demo"
  system: "./system.yaml"
limits:
  max_steps: 800000
assertions:
  - uart_contains: "OK"
  - expected_stop_reason: max_steps
