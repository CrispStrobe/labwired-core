# Three NUCLEO-F401RE nodes in a timed UART relay chain (Renode issue #948's
# scenario, small): n0 sends one 5-byte message per ms, n1 and n2 forward it.
# At 5.5 ms link 1 (n1 -> n2) slows by 500 us; at 8.6 ms n1 restarts while it
# is forwarding. Firmware: crates/core/tests/fixtures/uart-chain/uart-chain.c.
# See docs/howto/timed-uart-network.md.
schema_version: "1.0"
name: uart-relay-chain
nodes:
  - id: n0
    system: "../../configs/systems/nucleo-f401re.yaml"
    firmware: "../../crates/core/tests/fixtures/uart-chain/uart-chain-source.elf"
  - id: n1
    system: "../../configs/systems/nucleo-f401re.yaml"
    firmware: "../../crates/core/tests/fixtures/uart-chain/uart-chain-relay.elf"
  - id: n2
    system: "../../configs/systems/nucleo-f401re.yaml"
    firmware: "../../crates/core/tests/fixtures/uart-chain/uart-chain-relay.elf"
interconnects:
  - type: uart_network
    nodes: [n0, n1, n2]
    config:
      topology: chain
      uart_in: uart1
      uart_out: uart2
      messages: { sync: 0xA5, length: 5, id_offset: 1, id_bytes: 2, hop_offset: 3, checksum_xor: true }
      events:
        - { at_us: 5500, slow_link: 1, delay_us: 500 }
        - { at_us: 8600, reset_node: n1 }
      markers:
        - { node: n0, peripheral: gpioa, pin: 5, name: app }
        - { node: n1, peripheral: gpioa, pin: 5, name: app }
        - { node: n2, peripheral: gpioa, pin: 5, name: app }
