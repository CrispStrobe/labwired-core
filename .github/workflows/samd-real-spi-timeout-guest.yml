name: SAMD actual CODAL clock-gated SPI timeout guest
on:
  pull_request:
    paths: ['crates/core/tests/samd_real_spi_timeout_guest.rs', '.github/workflows/samd-real-spi-timeout-guest.yml']
permissions:
  contents: read
concurrency:
  group: real-spi-timeout-${{ github.ref }}
  cancel-in-progress: true
env:
  LABWIRED_SPI_SOURCE: 6f71d879fa3add9bfb8013cb71754b5d597f7186
jobs:
  spi-timeout-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: CrispStrobe/codal-samd
          ref: 6f71d879fa3add9bfb8013cb71754b5d597f7186
          path: owned-timeout-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-mclk-core
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: lancaster-university/codal-core
          ref: 2ed19d64ec3359143409a4b0a9758b4aeef3ee7d
          path: owned-gclk-core
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Build separately selected MCLK and GCLK timeout callers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
          arm-none-eabi-g++ --version
          dpkg-query -W gcc-arm-none-eabi
          cd owned-timeout-source
          bash runtime-services/build.sh ../owned-mclk-core "$RUNNER_TEMP/spi-timeout-10" 10
          bash runtime-services/build.sh ../owned-gclk-core "$RUNNER_TEMP/spi-timeout-11" 11
      - name: Nonvacuous timeout and recovery ordering controls
        run: cargo test --release --locked -p labwired-core --test samd_real_spi_timeout_guest -- --nocapture
      - name: Execute both actual clock gates in both scheduler profiles
        run: |
          set -o pipefail
          timeout_failures=0
          for mode in 10 11; do
            for profile in default scheduler; do
              feature_args=()
              if test "$profile" = scheduler; then feature_args=(--features event-scheduler); fi
              export LABWIRED_SPI_MODE="$mode"
              export LABWIRED_SPI_FIXTURE_DIR="$RUNNER_TEMP/spi-timeout-$mode"
              if ! cargo test --release --locked -p labwired-core "${feature_args[@]}" --test samd_real_spi_timeout_guest -- --ignored --nocapture 2>&1 | tee "spi-timeout-$mode-$profile.log"; then
                timeout_failures=$((timeout_failures + 1))
              fi
            done
          done
          # Preserve all four originals on failure; never convert failure to pass.
          test "$timeout_failures" -eq 0
      - name: Preserve actual timeout source and observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actual-codal-spi-timeout-guest-results
          path: |
            spi-timeout-*.log
            ${{ runner.temp }}/spi-timeout-10/
            ${{ runner.temp }}/spi-timeout-11/
