name: SAMD USB isolated codegen diagnostic
on:
  pull_request:
    paths:
      - 'scripts/perf/samd_usb_codegen_diagnostic.py'
      - '.github/workflows/samd-usb-codegen-diagnostic.yml'
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 3270808e9f22be54be7b99adc2dc6c8d1982ce23
          path: diagnostic-parent
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 6e7be97375eb58f091cbf048c58d2a674fdf30af
          path: diagnostic-candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            diagnostic-parent
            diagnostic-candidate
          key: usb-codegen-diagnostic
      - name: Install original measurement tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind binutils python3-yaml
      - name: One parent and candidate attribution with shared frozen fixture
        run: python3 -B scripts/perf/samd_usb_codegen_diagnostic.py diagnostic-parent diagnostic-candidate codegen-originals
      - name: Retain these exact diagnostic originals
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: samd-usb-codegen-attribution
          path: codegen-originals/**
          if-no-files-found: error
          retention-days: 14
