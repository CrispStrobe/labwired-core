name: Source-built SAMD native game CLI
on:
  pull_request:
    paths:
      - 'crates/core/src/**'
      - 'crates/cli/src/**'
      - 'crates/config/src/**'
      - 'configs/chips/samd51-no-asf-simulation.yaml'
      - 'configs/systems/samd51-no-asf-simulation.yaml'
      - 'configs/devices/st7735r-memory-simulation.yaml'
      - 'scripts/ci/build_samd_native_game.py'
      - 'validation/samd-native-profile/**'
      - '.github/workflows/samd-native-game-cli.yml'
permissions:
  contents: read
jobs:
  native-game-cli:
    if: ${{ github.repository == 'CrispStrobe/labwired-core' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: samd-native-game-cli
          cache-on-failure: true
      - name: Install hosted public-source compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build the exact public source and authored inputs
        run: |
          python3 -B scripts/ci/build_samd_native_game.py --work out/samd-native-game-source --out out/samd-native-game
      - name: Execute the actual CLI in both scheduler profiles
        env:
          LABWIRED_SAMD51_SIM_SW0: out/samd-native-game/sw0.bin
          LABWIRED_SAMD51_SIM_SERIAL: out/samd-native-game/serial.bin
        run: |
          set -euo pipefail
          test "$(wc -c < out/samd-native-game/sw0.bin)" = 1024
          test "$(wc -c < out/samd-native-game/serial.bin)" = 1024
          mkdir -p out/samd-native-game/cli-replay
          git rev-parse HEAD 'HEAD^{tree}' > out/samd-native-game/cli-replay/source.txt
          rustc -Vv > out/samd-native-game/cli-replay/compiler.txt
          toolchain_root="$(rustc --print sysroot)"
          sha256sum "$toolchain_root/bin/rustc" "$toolchain_root"/lib/librustc_driver-*.so > out/samd-native-game/cli-replay/compiler.sha256
          sha256sum Cargo.lock rust-toolchain.toml > out/samd-native-game/cli-replay/inputs.sha256
          cargo build --release --locked -p labwired-cli --no-default-features
          cp target/release/labwired out/samd-native-game/cli-replay/labwired-default
          sha256sum out/samd-native-game/cli-replay/labwired-default > out/samd-native-game/cli-replay/binaries.sha256
          target/release/labwired test --script validation/samd-native-profile/native-game.yaml --output-dir out/samd-native-game/cli-default 2>&1 | tee out/samd-native-game/cli-default.log
          cargo build --release --locked -p labwired-cli --features event-scheduler
          cp target/release/labwired out/samd-native-game/cli-replay/labwired-event-scheduler
          sha256sum out/samd-native-game/cli-replay/labwired-event-scheduler >> out/samd-native-game/cli-replay/binaries.sha256
          sha256sum target/release/labwired validation/samd-native-profile/native-game.yaml \
            configs/systems/samd51-no-asf-simulation.yaml configs/chips/samd51-no-asf-simulation.yaml \
            configs/devices/st7735r-memory-simulation.yaml out/samd-native-game/game.elf \
            out/samd-native-game/sw0.bin out/samd-native-game/serial.bin \
            > out/samd-native-game/cli-replay/differential-inputs.sha256
          hosted_status=0
          target/release/labwired test --script validation/samd-native-profile/native-game.yaml --output-dir out/samd-native-game/cli-scheduler 2>&1 | tee out/samd-native-game/cli-scheduler.log || hosted_status=$?
          reference_status=0
          LABWIRED_HOSTED_FAST=0 target/release/labwired test --script validation/samd-native-profile/native-game.yaml --output-dir out/samd-native-game/cli-scheduler-reference 2>&1 | tee out/samd-native-game/cli-scheduler-reference.log || reference_status=$?
          diagnostic_status=0
          printf '{"hosted_status":%d,"reference_status":%d}\n' "$hosted_status" "$reference_status" > out/samd-native-game/cli-replay/differential-status.json || diagnostic_status=$?
          if (( hosted_status != 0 )); then
            exit "$hosted_status"
          fi
          if (( reference_status != 0 )); then
            exit "$reference_status"
          fi
          exit "$diagnostic_status"
      - name: Retain source, compiler and actual CLI observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-built-samd-native-game-cli
          path: out/samd-native-game/
          if-no-files-found: error
          retention-days: 14
