name: Core Perf (simulator throughput)

# Holds per-board simulator throughput still.
#
# The gate measures host instructions retired per simulated CPU step, per
# board, under callgrind — see scripts/perf/board_perf.py for why that metric
# and not wall clock. Owned-fork PRs affecting the engine's hot paths, build
# settings or perf inputs run the full unchanged gate before merge. Docs-only
# PRs get a cheap selection check. Main/manual/schedule policy is preserved.
# Main regressions are tracked in one issue rather than lost in old run logs.
#
# The issue is a live status page, not a log: each run rewrites its body with
# the current state and only comments when the set of failing boards actually
# changes, so a regression that sits unfixed for a week is one issue with one
# body — not one comment per push to main. When the gate goes green the issue
# is closed automatically, which is also the only thing that ever closed it.
#
# Selection uses the actual tested merge's first-parent diff, including runtime
# deletions and renames. Incomplete source admission fails the selection check.

# Scheduled admission remains upstream-only. A fork's copied cron must not
# notify an upstream maintainer about a run they cannot see or stop.
on:
  push:
    branches:
      - main
    paths:
      - "crates/core/**"
      - "crates/cli/**"
      - "crates/config/**"
      - "configs/chips/**"
      # All THREE fixture crates, not just the unsuffixed one. This lane builds
      # firmware-perf-spin-xtensa and -riscv as well, and `firmware-perf-spin/**`
      # matches neither — so a change to a fixture never re-ran the lane that
      # consumes it. That is not hypothetical: the xtensa fixture was missing a
      # required esp-backtrace feature, the lane died compiling it on every main
      # commit for a day, and the one-line fix could not trigger its own gate.
      - "crates/firmware-perf-spin/**"
      - "crates/firmware-perf-spin-avr/**"
      - "crates/firmware-perf-spin-riscv/**"
      - "crates/firmware-perf-spin-xtensa/**"
      - "scripts/perf/**"
      - ".github/workflows/core-perf.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain*"
      - ".cargo/**"
  # The cheap scope job selects runtime/build/perf changes and preserves the
  # existing owned upstream-sync branch admission. Other PRs skip the build.
  pull_request:
    branches:
      - main
  schedule:
    # Nightly, after core-ci's 02:30 slot.
    - cron: "45 3 * * *"
  workflow_dispatch:
    inputs:
      samd_profile_only:
        description: 'Owned SAMD source controls and initial selected measurements; normal PR gates are unchanged'
        type: boolean
        default: false

concurrency:
  group: core-perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  perf-scope:
    name: perf-scope
    if: ${{ github.event_name != 'schedule' || github.repository == 'w1ne/labwired-core' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Test path and source-history admission
        run: python3 scripts/perf/test_pr_hotpath_gate.py
      - name: Select unchanged full gate
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          TESTED: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/perf/pr_hotpath_gate.py \
            --event "$EVENT" --repository "$REPOSITORY" --head-ref "$HEAD_REF" \
            --tested "$TESTED" --base "$BASE" --head "$HEAD" --output "$GITHUB_OUTPUT"

  board-throughput:
    name: board-throughput
    needs: perf-scope
    if: >-
      ${{ needs.perf-scope.outputs.required == 'true'
          && !(github.event_name == 'workflow_dispatch'
               && github.ref == 'refs/heads/fix/issue251-storage-boundary-20261019')
          && !(github.event_name == 'workflow_dispatch' && inputs.samd_profile_only
               && github.repository == 'CrispStrobe/labwired-core') }}
    # Keep absolute RTx and relative Ir/step receipts on one stable image.
    # `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19, which would silently
    # change both the compiler output and host throughput under our baselines.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-perf
          workspaces: |
            . -> target

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install valgrind + PyYAML
        run: |
          sudo apt-get update && sudo apt-get install -y valgrind gcc-avr binutils-avr avr-libc
          python -m pip install --quiet pyyaml

      # Xtensa has no rustup target — esp32, esp32s3 and esp32s3-zero need the
      # esp-rs LLVM fork. This step is `continue-on-error` so a flaky espup
      # download cannot take the other chips down with it. --require-all still
      # refuses to call the run green if those fixtures cannot be rebuilt.
      # Same install core-nightly's esp32s3-fixtures-e2e job already uses.
      - name: Install Xtensa toolchain (espup)
        continue-on-error: true
        # espup asks the GitHub API for the latest Xtensa release. Unauthenticated,
        # that call shares the runner IP's 60/h budget and 403s at random. The
        # token spends the job's own authenticated budget instead.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo install espup --locked
          espup install
          # NOTHING gets added to PATH here, deliberately. Putting
          # ~/.rustup/toolchains/esp/bin on PATH makes every later `cargo`
          # resolve to the esp fork's binary directly instead of the rustup
          # shim, and that fork carries no std for thumbv6m or riscv32imc — so
          # the FIRST fixture build dies with "can't find crate for `core`"
          # before a single board is measured (issue #843, run 31183553289).
          # board_perf.py already asks for this toolchain the correct way, with
          # `cargo +esp build`, which the shim resolves without help.
          rustup toolchain list

      # Fails in seconds if a chip descriptor exists that no fixture covers and
      # no waiver names, rather than after a 40-minute build and measure.
      - name: Check every chip is covered or waived
        run: python3 scripts/perf/board_perf.py --check-coverage

      # The browser ships labwired-core with `event-scheduler` (see
      # crates/wasm/Cargo.toml). Measuring without it would gate a build
      # configuration no user ever runs.
      - name: Build simulator CLI (browser feature set)
        run: cargo build --release -p labwired-cli --features event-scheduler

      - name: Require real time on every chip
        run: |
          set -o pipefail
          python3 scripts/perf/board_rtx.py --min-rtx 1.0 \
            --status-json rtx-status.json 2>&1 \
            | tee rtx-report.txt | tee perf-report.txt

      # The fixture firmware is linked by board_perf.py itself, once per memory
      # map in the matrix (STM32 / nRF / Kinetis / RP2xxx), so a chip on a new
      # memory map is covered by adding it to FIXTURES rather than by editing a
      # build step here. Run this after RTx: deterministic receipt drift must
      # never hide whether the product actually meets real time.
      - name: Measure per-board throughput
        id: perf
        run: |
          set -o pipefail
          python3 scripts/perf/board_perf.py --require-all \
            --status-json perf-status.json 2>&1 | tee -a perf-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: board-throughput-report
          path: |
            perf-report.txt
            perf-status.json
            rtx-report.txt
            rtx-status.json

      # A regression is a real product defect (every extra host instruction per
      # simulated step slows the browser twin by the same proportion), so it
      # gets a tracked, assigned issue rather than a red X someone scrolls past.
      # Draft-branch dispatches are qualification evidence, not shipped-main
      # status. They must neither replace main's report nor close its issue.
      - name: Track regression in an issue
        if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('perf-report.txt', 'utf8');

            // No status file means the gate died before it measured anything
            // (build break, missing valgrind, an unclassified chip). That is a
            // failure of the gate, not of a board, and it must not be filed as
            // a throughput regression against whatever the last signature was.
            let status = null;
            try {
              status = JSON.parse(fs.readFileSync('perf-status.json', 'utf8'));
            } catch (e) {
              core.warning('no perf-status.json — the gate failed before measuring');
            }
            let rtx = null;
            try {
              rtx = JSON.parse(fs.readFileSync('rtx-status.json', 'utf8'));
            } catch (e) {
              // Expected when the deterministic gate failed first. In every
              // other case the combined report below still names the error.
              core.warning('no rtx-status.json — absolute RTx did not complete');
            }

            const { owner, repo } = context.repo;
            const LABEL = 'perf-regression';

            // The signature is what makes this a status page instead of a
            // firehose: same failing boards at the same magnitude => the body
            // is refreshed silently, and nobody is notified a second time.
            // The mode is part of the signature: stm32l476 regressing on the
            // batched path the browser runs and on the single-step path are
            // different findings, and collapsing them would refresh the issue
            // body silently instead of notifying about the new one.
            const sig = status
              ? [
                  ...status.regressions.map(
                    (r) => `R:${r.board}/${r.mode}:${(r.delta * 100).toFixed(0)}`
                  ),
                  ...status.stale.map(
                    (s) => `S:${s.board}/${s.mode}:${(s.delta * 100).toFixed(0)}`
                  ),
                  ...(status.contract_failures || []).map(
                    (c) => `C:${c.board}/${c.mode}:${c.tick_interval}`
                  ),
                  ...(rtx ? rtx.failures.map((board) => `X:${board}`) : []),
                ].sort().join(',')
              : 'gate-error';

            const title = rtx && rtx.failures.length
              ? 'Simulator below real time (per-board RTx gate)'
              : status && status.regressions.length
              ? 'Simulator throughput regression (per-board perf gate)'
              : status && (status.contract_failures || []).length
              ? 'Simulator scheduler performance contract failed'
              : status
                ? 'Simulator perf baselines are stale (per-board perf gate)'
                : 'Simulator perf gate is failing to run';

            const body = [
              `<!-- perf-gate-signature: ${sig} -->`,
              `**Last run:** ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `**Commit:** ${context.sha}`,
              '',
              'This issue is rewritten by every run of the perf gate — it always',
              'shows the current state, and closes itself when the gate is green.',
              '',
              '```',
              report.slice(-8000),
              '```',
              '',
              'Re-baseline with `python3 scripts/perf/board_perf.py --update` if the',
              'cost is intentional (or to lock in an improvement).',
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            const hit = open.data[0];

            if (!hit) {
              const created = await github.rest.issues.create({
                owner, repo, title, body, labels: [LABEL],
              });
              // Unassigned issues are how "we don't act on regressions"
              // happens. Put it on someone the moment it opens.
              try {
                await github.rest.issues.addAssignees({
                  owner, repo, issue_number: created.data.number,
                  assignees: [owner],
                });
              } catch (e) {
                core.warning(`could not assign #${created.data.number}: ${e.message}`);
              }
              return;
            }

            const prevSig = (hit.body || '').match(/perf-gate-signature: (.*?) -->/);
            const changed = !prevSig || prevSig[1] !== sig;

            await github.rest.issues.update({
              owner, repo, issue_number: hit.number, title, body,
            });
            // Only a change in what is failing is worth a notification; an
            // unchanged failure is already fully described by the body above.
            if (changed) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: hit.number,
                body: `Failing set changed as of ${context.sha.slice(0, 8)} — see the issue body for the current report.`,
              });
            }

      # Nothing closed these issues before, so an old regression stayed "open"
      # long after it was re-baselined away and the next one looked like more of
      # the same. Green closes it.
      - name: Close the regression issue when green
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'perf-regression',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Perf gate is green as of ${context.sha.slice(0, 8)} (${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}) — closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });
            }

  issue251-pair:
    name: issue251 (${{ matrix.role }})
    if: >-
      ${{ github.repository == 'CrispStrobe/labwired-core'
          && github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/fix/issue251-storage-boundary-20261019' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: control
            source: 1c580dcb4e906b197778caa9dabe2ddb2db614c4
          - role: candidate
            source: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false

      - name: Bind measured source and toolchain
        env:
          ROLE: ${{ matrix.role }}
          SOURCE: ${{ matrix.source }}
          CONTROLLER: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python3 - <<'PYTHON'
          import hashlib, json, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          names = git('ls-files', 'scripts/perf', 'configs/chips', 'crates/firmware-perf-spin', 'crates/firmware-perf-spin-riscv', 'crates/firmware-perf-spin-xtensa', 'crates/firmware-perf-spin-avr', 'Cargo.lock', 'Cargo.toml').splitlines()
          packet = dict(role=os.environ['ROLE'], source=git('rev-parse', 'HEAD'), tree=git('rev-parse', 'HEAD^{tree}'), parents=git('show', '-s', '--format=%P', 'HEAD').split(), controller=os.environ['CONTROLLER'], run=os.environ['RUN_ID'], attempt=os.environ['ATTEMPT'], runner_image=os.environ.get('ImageVersion'), inputs={n: hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in names})
          Path('source-identity.json').write_text(json.dumps(packet, indent=2) + '\n')
          PYTHON

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: thumbv6m-none-eabi,riscv32imc-unknown-none-elf

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: issue251-${{ matrix.role }}
          workspaces: |
            . -> target

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install valgrind + PyYAML
        run: |
          sudo apt-get update && sudo apt-get install -y valgrind gcc-avr binutils-avr avr-libc
          python -m pip install --quiet pyyaml

      # Xtensa has no rustup target — esp32, esp32s3 and esp32s3-zero need the
      # esp-rs LLVM fork. This step is `continue-on-error` so a flaky espup
      # download cannot take the other chips down with it. --require-all still
      # refuses to call the run green if those fixtures cannot be rebuilt.
      # Same install core-nightly's esp32s3-fixtures-e2e job already uses.
      - name: Install Xtensa toolchain (espup)
        continue-on-error: true
        # espup asks the GitHub API for the latest Xtensa release. Unauthenticated,
        # that call shares the runner IP's 60/h budget and 403s at random. The
        # token spends the job's own authenticated budget instead.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo install espup --locked
          espup install
          # NOTHING gets added to PATH here, deliberately. Putting
          # ~/.rustup/toolchains/esp/bin on PATH makes every later `cargo`
          # resolve to the esp fork's binary directly instead of the rustup
          # shim, and that fork carries no std for thumbv6m or riscv32imc — so
          # the FIRST fixture build dies with "can't find crate for `core`"
          # before a single board is measured (issue #843, run 31183553289).
          # board_perf.py already asks for this toolchain the correct way, with
          # `cargo +esp build`, which the shim resolves without help.
          rustup toolchain list

      # Fails in seconds if a chip descriptor exists that no fixture covers and
      # no waiver names, rather than after a 40-minute build and measure.
      - name: Check every chip is covered or waived
        run: python3 scripts/perf/board_perf.py --check-coverage

      # The browser ships labwired-core with `event-scheduler` (see
      # crates/wasm/Cargo.toml). Measuring without it would gate a build
      # configuration no user ever runs.
      - name: Build simulator CLI (browser feature set)
        run: cargo build --release -p labwired-cli --features event-scheduler

      - name: Record installed tools and measured CLI
        run: |
          {
            rustc -Vv
            cargo -V
            valgrind --version
            avr-gcc --version
          } > toolchain.txt
          sha256sum target/release/labwired > cli.sha256
          nm -C target/release/labwired > cli-symbols.txt
          objdump -d -C target/release/labwired > cli-disassembly.txt

      - name: Require real time on every chip
        run: |
          set -o pipefail
          python3 scripts/perf/board_rtx.py --min-rtx 1.0 \
            --status-json rtx-status.json 2>&1 \
            | tee rtx-report.txt | tee perf-report.txt

      # The fixture firmware is linked by board_perf.py itself, once per memory
      # map in the matrix (STM32 / nRF / Kinetis / RP2xxx), so a chip on a new
      # memory map is covered by adding it to FIXTURES rather than by editing a
      # build step here. Run this after RTx: deterministic receipt drift must
      # never hide whether the product actually meets real time.
      - name: Measure per-board throughput
        id: perf
        continue-on-error: ${{ matrix.role == 'control' }}
        run: |
          set -o pipefail
          python3 scripts/perf/board_perf.py --require-all \
            --status-json perf-status.json 2>&1 | tee -a perf-report.txt

      - name: Validate full gate and expected negative control
        env:
          ROLE: ${{ matrix.role }}
          OUTCOME: ${{ steps.perf.outcome }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          perf = json.loads(Path('perf-status.json').read_text())
          rtx = json.loads(Path('rtx-status.json').read_text())
          assert rtx['ok'] is True, 'native real-time gate failed'
          assert not perf['contract_failures'] and not perf['unmeasurable'] and not perf['skipped'], 'incomplete full matrix'
          assert sum(map(len, perf['measured'].values())) == 82 and len(perf['matched']) == 42, 'unexpected coverage'
          if os.environ['ROLE'] == 'control':
              assert os.environ['OUTCOME'] == 'failure' and perf['ok'] is False
              assert len(perf['regressions']) == 30 and all(r['mode'] == 'step' for r in perf['regressions']), 'original regression not reproduced'
          else:
              assert os.environ['OUTCOME'] == 'success' and perf['ok'] is True and not perf['regressions'], 'candidate must pass unchanged gate'
          PYTHON

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: issue251-${{ matrix.role }}
          path: |
            source-identity.json
            toolchain.txt
            cli.sha256
            cli-symbols.txt
            cli-disassembly.txt
            perf-report.txt
            perf-status.json
            rtx-report.txt
            rtx-status.json

  samd-native-profile:
    name: samd-native-profile
    needs: perf-scope
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.samd_profile_only && github.repository == 'CrispStrobe/labwired-core' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-perf
          workspaces: |
            . -> target
          cache-on-failure: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install selected measurement tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind
          python -m pip install --quiet pyyaml
      - name: Freeze source and compiler identities
        run: |
          mkdir samd-profile-evidence
          git rev-parse HEAD > samd-profile-evidence/source.txt
          rustc --version --verbose > samd-profile-evidence/rustc.txt
          cargo --version > samd-profile-evidence/cargo.txt
          git ls-files -z Cargo.toml Cargo.lock crates/core/Cargo.toml crates/cli/Cargo.toml crates/cli/src crates/firmware-perf-spin crates/config crates/core/src crates/core/tests/samd_native_quiescent.rs crates/core/tests/samd_native_simulation_bundle.rs configs/chips/samd51-no-asf-simulation.yaml scripts/perf .github/workflows/core-perf.yml | xargs -0 sha256sum > samd-profile-evidence/source-sha256.txt
      - name: Check inactive chunks and all strict architectural boundaries
        run: |
          set -o pipefail
          cargo test --release --locked -p labwired-core --features event-scheduler --test samd_native_quiescent --test samd_native_simulation_bundle -- --nocapture 2>&1 | tee samd-profile-evidence/controls.log
      - name: Require the external-runner cadence control to reject its old widening
        run: |
          python3 - <<'PYCONTROL'
          from pathlib import Path
          import hashlib,json,subprocess
          source=Path('crates/core/src/machine/advance.rs')
          before=source.read_bytes()
          old=b'self.advance_inner::<false>(request, Some(&mut run_window))'
          new=b'self.advance_inner::<true>(request, Some(&mut run_window))'
          assert before.count(old)==1
          try:
              source.write_bytes(before.replace(old,new))
              result=subprocess.run(['cargo','test','--release','--locked','-p','labwired-core','--features','event-scheduler','--test','samd_native_quiescent','external_window_runner_keeps_the_strict_service_grid','--','--exact','--nocapture'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              Path('samd-profile-evidence/external-runner-mutation.log').write_bytes(result.stdout)
          finally:
              source.write_bytes(before)
          assert source.read_bytes()==before
          subprocess.run(['git','diff','--exit-code','--',str(source)],check=True)
          text=result.stdout.decode(errors='replace')
          detected=result.returncode==101 and 'running 1 test' in text and 'test external_window_runner_keeps_the_strict_service_grid ... FAILED' in text and 'test result: FAILED. 0 passed; 1 failed;' in text
          Path('samd-profile-evidence/external-runner-mutation.json').write_text(json.dumps({'mutation':'restore external runner widening','detected':detected,'exit_code':result.returncode,'tests':1,'candidate_source_sha256':hashlib.sha256(before).hexdigest(),'restored_source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'log_sha256':hashlib.sha256(result.stdout).hexdigest()},indent=2)+'\n')
          assert detected,'external-runner cadence mutation escaped or never executed'
          print('EXTERNAL_RUNNER_CADENCE_MUTATION_DETECTED; candidate bytes restored before CLI build')
          PYCONTROL
      - name: Build the unchanged production CLI feature set
        run: |
          cargo build --release -p labwired-cli --features event-scheduler
          sha256sum target/release/labwired > samd-profile-evidence/cli-sha256.txt
      - name: Require the original real-time threshold on this actual profile
        run: |
          set -o pipefail
          python3 scripts/perf/board_rtx.py --boards samd51-no-asf-simulation --min-rtx 1.0 --status-json samd-profile-evidence/rtx-status.json 2>&1 | tee samd-profile-evidence/rtx-report.txt
      - name: Measure both actual deterministic modes without changing a baseline
        env:
          LABWIRED_PERF_EVIDENCE_DIR: samd-profile-evidence/raw-measurements
        run: |
          valgrind --version > samd-profile-evidence/valgrind.txt
          set -o pipefail
          python3 scripts/perf/board_perf.py --boards samd51-no-asf-simulation --status-json samd-profile-evidence/perf-status.json 2>&1 | tee samd-profile-evidence/perf-report.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: samd-native-profile-source-and-measurements
          path: samd-profile-evidence/
          if-no-files-found: error
          retention-days: 14
