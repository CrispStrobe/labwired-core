name: SAM SPI focused same-runner diagnostic (not qualification)

# Diagnostic branch only: never merge this replacement for the full fleet gate.
# Baseline failures are retained in reports; this does not waive any gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sam-spi-focused-pair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 67920fcf8d82c74f3cc63285181fe26db93cf720
          path: base
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 547da6da814afd0375199b192db7e3e2416042a0
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: thumbv6m-none-eabi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          python -m pip install --quiet pyyaml
          mkdir results
          uname -a > results/runner.txt
          lscpu >> results/runner.txt
          rustc -vV >> results/runner.txt
          git -C base rev-parse HEAD > results/base-source.txt
          git -C candidate rev-parse HEAD > results/candidate-source.txt
      - name: Build base CLI
        working-directory: base
        run: |
          cargo build --release --locked -p labwired-cli --features event-scheduler
          sha256sum target/release/labwired > ../results/base-binary.sha256
      - name: Measure base twice (preserve baseline failures)
        working-directory: base
        run: |
          for repeat in 1 2; do
            set +e
            python3 scripts/perf/board_perf.py \
              --cli target/release/labwired \
              --boards stm32f411ceu6,stm32f401,atsamd51-pybadge --modes batch \
              --require-all --status-json "../results/base-${repeat}.json" \
              > "../results/base-${repeat}.txt" 2>&1
            result=$?
            set -e
            echo "$result" > "../results/base-${repeat}.exit"
            test -s "../results/base-${repeat}.json"
          done
      - name: Build candidate CLI (same runner, isolated target directory)
        working-directory: candidate
        run: |
          cargo build --release --locked -p labwired-cli --features event-scheduler
          sha256sum target/release/labwired > ../results/candidate-binary.sha256
      - name: Measure candidate twice (preserve baseline failures)
        working-directory: candidate
        run: |
          for repeat in 1 2; do
            set +e
            python3 scripts/perf/board_perf.py \
              --cli target/release/labwired \
              --boards stm32f411ceu6,stm32f401,atsamd51-pybadge --modes batch \
              --require-all --status-json "../results/candidate-${repeat}.json" \
              > "../results/candidate-${repeat}.txt" 2>&1
            result=$?
            set -e
            echo "$result" > "../results/candidate-${repeat}.exit"
            test -s "../results/candidate-${repeat}.json"
            python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert not any(r[k] for k in ("contract_failures", "unmeasurable", "never_measured", "skipped")), r' "../results/candidate-${repeat}.json"
          done
      - name: Upload raw diagnostic reports (not executable artifacts)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sam-spi-focused-pair
          path: results/
          if-no-files-found: error
