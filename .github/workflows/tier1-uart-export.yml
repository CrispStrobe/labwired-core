name: Export hash-matched authored Tier1 fixtures
on:
  pull_request:
    paths: ['.github/workflows/tier1-uart-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bf7452f0ae6f52effef85abd83c09815f5acbcda
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: thumbv7m-none-eabi,thumbv7em-none-eabi
      - name: Reproduce the audited guest inputs, without rerunning an engine
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = b477c9530e36188e7bedb8ea0dd5904cdb587c36
          (cd examples/tier1-fixture/nrf52832 && cargo build --locked --release --target thumbv7em-none-eabi)
          (cd examples/tier1-fixture/stm32f103 && cargo build --locked --release --target thumbv7m-none-eabi)
          mkdir fixture-export
          cp target/thumbv7em-none-eabi/release/tier1-fixture-nrf52832 fixture-export/nrf52832.elf
          cp examples/tier1-fixture/stm32f103/target/thumbv7m-none-eabi/release/tier1-fixture-stm32f103 fixture-export/stm32f103.elf
          cd fixture-export
          sha256sum --check <<'DIGESTS'
          d754f4e9a76a39b4b12df2cf9c6fa54e59047a196d2c06899000588d943b26c4  nrf52832.elf
          4e8f7755b014e02c12d099d6d063be0d761cc604ed7778981388b79b321dd82c  stm32f103.elf
          DIGESTS
      - name: Export only the two hash-matched public authored guest fixtures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tier1-uart-hash-matched-fixtures
          path: fixture-export/*.elf
          if-no-files-found: error
