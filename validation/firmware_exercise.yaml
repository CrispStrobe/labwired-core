  - id: stm32h735
    arch: cortex-m7
    headline: "SIM-DERIVED first Cortex-M7 part. Its committed tier-1 fixture is PR-gated (`firmware_survival::test_stm32h735_tier1_survival`, Session builder) and drives clock/gpio/timer/pwm/i2c/spi/wdt/irq plus UART on USART3, leaving adc unrecorded and dma/rtc n/a (neither declared); the nightly h735-telematics-lab cell is the only other gated firmware (SPI1 TFT, USART1 BG770A modem, USART3 console), and its +QGPSLOC decode is not value-asserted — a parse failure falls back to a constant, so the transcript proves the stack ran, not the fix. Beyond the rubric, PWR (PwrH7) is driven only by the un-gated stm32h735-hal-demo/embassy-demo bring-up — no CI gate and no PwrH7 unit test — RNG has only the shared kernel-clock unit tests (rcc_kernel_clock_gate.rs:184-254) and no firmware, DBGMCU is driven by nothing at all, FDCAN1/2 are pinned by fdcan.rs's 18 model unit tests plus the estate test's reset-value and CCCR-independence probes — no firmware touches them — CRC has only the shared IDR-width unit test, and SYSCFG/WWDG are a seeded stub window and an inert register bank."
    functional: []
    advanced_unit_only: [CRC, FDCAN1, FDCAN2, RNG]
    advanced_dead: [PWR, DBGMCU]
    dead_note: "PwrH7 was written for the H7 HAL's pwr.freeze() (VOSRDY/ACTVOSRDY) and the two community-HAL demos do run it, but neither example is wired into any test or workflow and pwr.rs has no PwrH7 unit test; DBGMCU has no firmware and no test at all."
