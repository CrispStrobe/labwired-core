  # ── STM32 U5/WB/WBA batch. The U575 has no tier-1 row (absent from
  # ── TIER1_TARGETS and tier1-matrix.json); the WB55 and WBA52 each own one
  # ── (nightly-ratcheted, core-ci.yml:2086). On WB55/WBA52 every beyond-rubric
  # ── block is firmware-driven; U575, being rowless, has GPDMA1/RNG unit-only.
  # ── The batch's only shims are the U575 and WBA52 ICACHE stub windows.
  - id: stm32u575
    arch: cortex-m33
    headline: "SIM-DERIVED first U5 part with NO tier-1 target (absent from TIER1_TARGETS and tier1-matrix.json), so this entry carries the whole story. The committed firmware is the two PR-gated `firmware_survival` boots: the stock Zephyr 3.7.2 hello (U5 RCC PLL1/ready pairs, PWR, DBGMCU_CR, ICACHE, USART1 VCP console) and the Arduino L0 serial (HAL_PWREx_ControlVoltageScaling SVMSR/VOSR poll, HAL_CRC_Init CRC_POL/INIT/CR, HAL_RCCEx_CRSConfig, HAL_ICACHE_Enable). The Arduino matrix L0–L8 runs on its push-to-main/nightly lane (core-arduino-matrix-smoke.yml:15, NOT PR) and drives the rubric classes (INA219 on I2C1, MAX31855 on SPI1, ADC/PWM/timer, FDCAN1 internal loopback). Beyond the rubric, GPDMA1 is the one modeled-but-firmware-untouched block (22 gpdma.rs unit tests; neither survival ELF contains its 0x40020000 base), RNG is exercised only by the L073 kernel-clock unit tests over the L073 bus (rcc_kernel_clock_gate.rs:184-254 — no U575 behavioral test drives it; register_coverage.rs:128,169-179 only pokes the window), and ICACHE is a hardcoded StubPeripheral. PWR/CRC/CRS/DBGMCU are all firmware-driven — the CRC polynomial engine (crc.rs:66) is still driven by no firmware (the only always-run unit coverage is IDR-width masking, crc.rs:204) and CRS has no SYNC source or trim loop, but the HAL never polls one."
    advanced_unit_only: [GPDMA1, RNG]
    advanced_dead: []
    shim:
      - {p: "ICACHE", ev: "configs/chips/stm32u575.yaml:447 (type: icache; crates/core/src/peripherals/generic_factory.rs:734)", note: "CLOSABLE: hardcoded StubPeripheral::new(0x00) — read 0, writes dropped. The PR-gated Arduino startup's HAL_ICACHE_Enable/ConfigAssociativityMode and the Zephyr boot's ICACHE enable writes are accepted but never latch, and neither polls a status bit, so the no-op cannot be detected (docs/boards/stm32u575.md:65 calls the window a stub declared so HAL_ICACHE_Enable cannot bus-fault)."}

  - id: stm32wb55
    arch: cortex-m4
    headline: "Dual-core WB (Cortex-M4 app + M0+ radio). Its committed tier-1 fixture (nightly-ratcheted by the full-CI `tier1_matrix_ratchet` step (core-ci.yml:2086)) drives all 12 declared classes including dma through DMA1; on the PR gate both `firmware_survival` boots cover every beyond-rubric block the descriptor declares: the Zephyr hello exercises the HSEM inter-core lock (the RLR read of Zephyr's z_stm32_hsem_lock is granted to CPU1 — this is why HSEM is NOT dead here as the L476 entry records it: the WB boot firmware actually drives the lock, while nothing on the L476 touches the model), the classic RCC BDCR LSE path, PWR and DBGMCU_CR; the Arduino serial startup writes CRC_POL at 0x4002_3014 (the reason that survival case exists), takes the same HSEM lock path and PWR backup-access. No beyond-rubric block is left unexercised and there are no shims."
    advanced_unit_only: []
    advanced_dead: []
    shim: []

