note: 'Microchip ATSAMD21G18A (Cortex-M0+, 256K flash at 0x0 / 32K SRAM) — the first SAM part in the engine,
  Arduino Zero / Feather M0 class. PORT and SERCOM are BEHAVIOURAL models, not stubs: PORT implements
  the DIR/OUT SET-CLR-TGL aliases as one register each, WRCONFIG''s bulk PINCFG/PMUX write (the path ASF
  and the Arduino SAMD core actually take), and IN reading back what an output pin drives; SERCOM implements
  USART mode with DRE derived from CTRLA.ENABLE. A bare-metal firmware performs the real bring-up in datasheet
  order (NVMCTRL wait states, the SYSCTRL.PCLKSR ready poll, three GCLK SYNCBUSY spins, PM.APBCMASK, WRCONFIG,
  CTRLB before CTRLA.ENABLE) and its console reaches the capture sink — examples/samd21-smoke/io-smoke.yaml,
  7 checks, executed by BOTH the strict-onboarding gate and the coverage matrix. Three of those checks
  are memory_value reads of the PORT registers the firmware configured, so the banner is not the gate.
  Every base and IRQ is checked against Microchip''s Apache-2.0 ATSAMD21G18A.svd by svd_conformance with
  ZERO justified deviations. NOT PROVEN: no SAM D21 silicon diff (no bench part); nothing is clock-gated
  except the SERCOM3 I2C master, the ADC and TCC0..2, which read PM.APBCMASK themselves (PM is a register
  bank, so firmware that forgets APBCMASK for any other block works here and fails on hardware); SYNCBUSY
  always reads 0 and transmission has no latency — modelling truths, not silicon ones; SERCOM3 runs as
  the I2C master slice and SERCOM4 as the SPI master (the Arduino Zero variant roles; stock ArduinoCore-samd
  Wire reads an INA219 and SPI a MAX31855, arduino-matrix L3/L4), with no SCL/SCK timing and no SPI interrupt;
  TCC0..2 count at the CPU clock (GCLK is a register bank, not checked) and drive single-slope NPWM onto
  their PMUX E/F pads (stock analogWrite on D13 = PA17 = TCC2/WO1 is a 732 Hz, 50.0% waveform on the pad,
  arduino-matrix L6); EIC, TC3..5 and DMAC are unmodelled and their windows deliberately unmapped; the
  ADC converts single-ended AINn against GND on the internal references (stock analogRead() reads A0 at
  a board-driven 1650 mV as exactly 512, arduino-matrix L5) with no settling, noise or IRQ; DAC and USB
  are declarative register banks only.'
