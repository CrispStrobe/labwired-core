  result: 're-captured live 2026-08-09 on a SECOND physical C3 (MAC 9c:cc:01:d0:98:e0; the 2026-06-11
    baseline came from 38:44:be:42:f5:58, same QFN32 rev v0.4) — cross-board corroboration, not a re-read
    of the same part. 1207 registers read in ONE state (21 estate windows + 43 control registers + the
    radio windows): 84/84 RESET_VALUES matched, 0 mismatched, and both FREE_RUNNING_COUNTERS windows mapped.
    Radio note: a JTAG `reset halt` on the C3 is a software CORE reset that does not cold-reset peripherals,
    so RADIO_FE/WIFI_MAC only read their cold baseline when no resident firmware has brought the PHY up
    — the board was temporarily flashed with crates/wasm/tests/fixtures/esp32c3-hello-world-flash.bin
    for the capture, then its original 4 MB image was restored and verified byte-identical (sha256 844abc88…8a910).
    Do NOT try to reach cold radio via RTC_CNTL SW_SYS_RST: it resets the USB-Serial-JTAG bridge too and
    drops the debug link mid-write (verified, LIBUSB_ERROR_IO). Artifacts: scripts/hw-oracle/captures/esp32c3/recapture-20260809T121824Z/.'
