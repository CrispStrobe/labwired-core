    vs hw=0x2E, because the serial-instance broadcast PSEL WRITES to both halves but dispatched READS
    to TWIM, which models only 0x508/0x50C; (3) SPIM PSEL.CSN (0x514) was missing from Nrf52SpiRegs entirely
    — corroborated present on silicon (wrote 0x2B, read 0x2B). Guarded going forward by a hardware-free
    unit test, serial_instance::psel_block_reads_back_while_disabled.'
