#
# NXP i.MX RT1062 (MIMXRT1062DVL6A), Cortex-M7 + FPv5-D16.
# Every base address and IRQ below is read from the vendored SVD
# tests/fixtures/real_world/mimxrt1062.svd (NXP MIMXRT1062, version 1.0).
#
# Memory map (IMXRT1060RM rev 3, ch. 2 "Memory Maps"):
#   ITCM  0x0000_0000  FlexRAM TCM, up to 512 KB
#   DTCM  0x2000_0000  FlexRAM TCM, up to 512 KB
#   OCRAM 0x2020_0000  OCRAM2 512 KB + FlexRAM OCRAM at 0x2028_0000
#   FlexSPI XIP 0x6000_0000 (external serial NOR)
# The FlexRAM bank split (IOMUXC_GPR17) decides how much of the 512 KB each
# TCM gets on silicon. The simulator maps each TCM at its architectural
# maximum, so any legal bank split fits.
#
# Boot: the chip ROM (not modelled) hands over to the image's vector table at
# FlexSPI 0x6000_0000 + reset_vector_offset.

name: "mimxrt1062"
arch: "arm"
core: "cortex-m7"
cpu_hz: 600_000_000
flash:
  base: 0x60000000
  size: "16384KB"
reset_vector_offset: 0x10000
# ITCM is real memory at 0x0: no STM32-style flash boot alias there.
flash_boot_alias: false
ram:
  base: 0x20000000
  size: "512KB"
memory_regions:
  - name: "itcm"
    base: 0x00000000
    size: "512KB"
  - name: "ocram"
    base: 0x20200000
    size: "1024KB"
peripherals:
  # ---- Clocks and power (behavioural: firmware polls their status bits) ----
  # DC-DC converter: REG0.STS_DC_OK drops on a target change and recovers.
  - id: "dcdc"
    type: "imxrt_dcdc"
    base_address: 0x40080000
    size: "4KB"
    irq: 69
  # CCM_ANALOG + PMU + USB_ANALOG + XTALOSC24M + TEMPMON (one window in the
  # SVD): PLL LOCK, LDO OK, XTAL OK FSMs, SET/CLR/TOG aliases.
  - id: "anadig"
    type: "imxrt_anadig"
    base_address: 0x400D8000
    size: "4KB"
    irq: 61
  # CCM: divider/mux handshake (CDHIPR) and oscillator ready.
  - id: "ccm"
    type: "imxrt_ccm"
    base_address: 0x400FC000
    size: "4KB"
    irq: 95
  # ---- FlexSPI + serial NOR on port A1 (the XIP flash at 0x60000000) ----
  # The NOR part is not identified from the FB200 image; the JEDEC ID is a
  # Winbond W25Q128JV (16 MB, matching the flash window) - an assumption.
  - id: "flexspi"
    type: "imxrt_flexspi"
    base_address: 0x402A8000
    size: "16KB"
    irq: 108
    config:
      jedec_id: 0xEF4018
      xip_base: 0x60000000
      xip_size: 0x1000000
  # ---- USB OTG controllers (device mode) + UTMI PHYs ----
  # USB1 carries a simulated host that enumerates the device.
  - id: "usb1"
    type: "imxrt_usb"
    base_address: 0x402E0000
    size: "512B"
    irq: 113
  - id: "usb2"
    type: "imxrt_usb"
    base_address: 0x402E0200
    size: "512B"
    irq: 112
    config:
      host: false
  - id: "usbphy1"
    type: "imxrt_usbphy"
    base_address: 0x400D9000
    size: "4KB"
    irq: 65
  - id: "usbphy2"
    type: "imxrt_usbphy"
    base_address: 0x400DA000
    size: "4KB"
    irq: 66
  # ---- eDMA (32 channels, TCDs at +0x1000) + DMAMUX request routing ----
  # Channel n and n+16 share NVIC line n (0..15); 16 is the error line.
  - id: "edma"
    type: "imxrt_edma"
    base_address: 0x400E8000
    size: "8KB"
    irq: 0
  - id: "dmamux"
    type: "declarative"
    base_address: 0x400EC000
    size: "4KB"
    config:
      path: "../peripherals/mimxrt1062/dmamux.yaml"
  # ---- Timers ----
  - id: "gpt1"
    type: "imxrt_gpt"
    base_address: 0x401EC000
    size: "16KB"
    irq: 100
  - id: "gpt2"
    type: "imxrt_gpt"
    base_address: 0x401F0000
    size: "16KB"
    irq: 101
  # ---- FlexIO (functional clock: CCM reset value 30 MHz) ----
  - id: "flexio1"
    type: "imxrt_flexio"
    base_address: 0x401AC000
    size: "16KB"
    irq: 90
  - id: "flexio2"
    type: "imxrt_flexio"
    base_address: 0x401B0000
    size: "16KB"
    irq: 91
  - id: "flexio3"
    type: "imxrt_flexio"
    base_address: 0x42020000
    size: "16KB"
    irq: 156
  # ---- SAI (master clock 256 x 44.1 kHz; SAI3 TX has its own line 59) ----
  - id: "sai1"
    type: "imxrt_sai"
    base_address: 0x40384000
    size: "16KB"
    irq: 56
  - id: "sai2"
    type: "imxrt_sai"
    base_address: 0x40388000
    size: "16KB"
    irq: 57
  - id: "sai3"
    type: "imxrt_sai"
    base_address: 0x4038C000
    size: "16KB"
    irq: 58
    config:
      tx_irq: 59
  # ---- Register files (SVD reset values, no status polls) ----
  - id: "iomuxc"
    type: "declarative"
    base_address: 0x401F8000
    size: "16KB"
    config:
      path: "../peripherals/mimxrt1062/iomuxc.yaml"
  # FlexRAM bank split (GPR16/17), TCM sizing (GPR14)
  - id: "iomuxc_gpr"
    type: "declarative"
    base_address: 0x400AC000
    size: "4KB"
    config:
      path: "../peripherals/mimxrt1062/iomuxc_gpr.yaml"
  - id: "iomuxc_snvs"
    type: "declarative"
    base_address: 0x400A8000
    size: "4KB"
    config:
      path: "../peripherals/mimxrt1062/iomuxc_snvs.yaml"
  - id: "iomuxc_snvs_gpr"
    type: "declarative"
    base_address: 0x400A4000
    size: "4KB"
    config:
      path: "../peripherals/mimxrt1062/iomuxc_snvs_gpr.yaml"
  - id: "flexram"
    type: "declarative"
    base_address: 0x400B0000
    size: "4KB"
    irq: 38
    config:
      path: "../peripherals/mimxrt1062/flexram.yaml"
  - id: "wdog1"
    type: "declarative"
    base_address: 0x400B8000
    size: "4KB"
    irq: 92
    config:
      path: "../peripherals/mimxrt1062/wdog1.yaml"
  - id: "wdog2"
    type: "declarative"
    base_address: 0x400D0000
    size: "4KB"
    irq: 45
    config:
      path: "../peripherals/mimxrt1062/wdog2.yaml"
  - id: "rtwdog"
    type: "declarative"
    base_address: 0x400BC000
    size: "4KB"
    irq: 93
    config:
      path: "../peripherals/mimxrt1062/rtwdog.yaml"
  - id: "snvs"
    type: "declarative"
    base_address: 0x400D4000
    size: "16KB"
    irq: 46
    config:
      path: "../peripherals/mimxrt1062/snvs.yaml"
  - id: "src"
    type: "declarative"
    base_address: 0x400F8000
    size: "4KB"
    irq: 98
    config:
      path: "../peripherals/mimxrt1062/src.yaml"
  - id: "gpc"
    type: "declarative"
    base_address: 0x400F4000
    size: "4KB"
    irq: 97
    config:
      path: "../peripherals/mimxrt1062/gpc.yaml"
  - id: "ocotp"
    type: "declarative"
    base_address: 0x401F4000
    size: "4KB"
    config:
      path: "../peripherals/mimxrt1062/ocotp.yaml"
  - id: "romc"
    type: "declarative"
    base_address: 0x40180000
    size: "4KB"
    config:
      path: "../peripherals/mimxrt1062/romc.yaml"
  - id: "xbara1"
    type: "declarative"
    base_address: 0x403BC000
    size: "4KB"
    config:
      path: "../peripherals/mimxrt1062/xbara1.yaml"
  - id: "aipstz1"
    type: "declarative"
    base_address: 0x4007C000
    size: "4KB"
    config:
      path: "../peripherals/mimxrt1062/aipstz1.yaml"
  # ---- Analog ----
  - id: "adc1"
    type: "imxrt_adc"
    base_address: 0x400C4000
    size: "4KB"
    irq: 67
  - id: "adc2"
    type: "imxrt_adc"
    base_address: 0x400C8000
    size: "4KB"
    irq: 68
  # ---- GPIO (standard GPIO1..5; GPIO6..9 are the fast aliases) ----
  - id: "gpio1"
    type: "gpio"
    base_address: 0x401B8000
    size: "16KB"
    irq: 80
    config:
      profile: "imxrt"
  - id: "gpio2"
    type: "gpio"
    base_address: 0x401BC000
    size: "16KB"
    irq: 82
    config:
      profile: "imxrt"
  - id: "gpio3"
    type: "gpio"
    base_address: 0x401C0000
    size: "16KB"
    irq: 84
    config:
      profile: "imxrt"
  - id: "gpio4"
    type: "gpio"
    base_address: 0x401C4000
    size: "16KB"
    irq: 86
    config:
      profile: "imxrt"
  - id: "gpio5"
    type: "gpio"
    base_address: 0x400C0000
    size: "16KB"
    irq: 88
    config:
      profile: "imxrt"
  - id: "gpio6"
    type: "gpio"
    base_address: 0x42000000
    size: "16KB"
    irq: 157
    config:
      profile: "imxrt"
  - id: "gpio7"
    type: "gpio"
    base_address: 0x42004000
    size: "16KB"
    irq: 157
    config:
      profile: "imxrt"
  - id: "gpio8"
    type: "gpio"
    base_address: 0x42008000
    size: "16KB"
    irq: 157
    config:
      profile: "imxrt"
  - id: "gpio9"
    type: "gpio"
    base_address: 0x4200C000
    size: "16KB"
    irq: 157
    config:
      profile: "imxrt"
  # ---- LPUART1..8 (functional clock 80 MHz = PLL3/6, SDK default) ----
  - id: "lpuart1"
    type: "imxrt_lpuart"
    base_address: 0x40184000
    size: "16KB"
    irq: 20
  - id: "lpuart2"
    type: "imxrt_lpuart"
    base_address: 0x40188000
    size: "16KB"
    irq: 21
  - id: "lpuart3"
    type: "imxrt_lpuart"
    base_address: 0x4018c000
    size: "16KB"
    irq: 22
  - id: "lpuart4"
    type: "imxrt_lpuart"
    base_address: 0x40190000
    size: "16KB"
    irq: 23
  - id: "lpuart5"
    type: "imxrt_lpuart"
    base_address: 0x40194000
    size: "16KB"
    irq: 24
  - id: "lpuart6"
    type: "imxrt_lpuart"
    base_address: 0x40198000
    size: "16KB"
    irq: 25
  - id: "lpuart7"
    type: "imxrt_lpuart"
    base_address: 0x4019c000
    size: "16KB"
    irq: 26
  - id: "lpuart8"
    type: "imxrt_lpuart"
    base_address: 0x401a0000
    size: "16KB"
    irq: 27
  # ---- LPI2C1..4 masters (functional clock 60 MHz = PLL3/8) ----
  - id: "lpi2c1"
    type: "imxrt_lpi2c"
    base_address: 0x403f0000
    size: "16KB"
    irq: 28
  - id: "lpi2c2"
    type: "imxrt_lpi2c"
    base_address: 0x403f4000
    size: "16KB"
    irq: 29
  - id: "lpi2c3"
    type: "imxrt_lpi2c"
    base_address: 0x403f8000
    size: "16KB"
    irq: 30
  - id: "lpi2c4"
    type: "imxrt_lpi2c"
    base_address: 0x403fc000
    size: "16KB"
    irq: 31
  - id: "systick"
    type: "systick"
    base_address: 0xE000E010
