- id: CH0_CONF0
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TIMER_SEL
    bit_range:
    - 1
    - 0
    description: 'This field is used to select one of timers for channel %s. 0: select timer0, 1: select timer1, 2: select timer2, 3: select timer3'
  - name: SIG_OUT_EN
    bit_range:
    - 2
    - 2
    description: Set this bit to enable signal output on channel %s.
  - name: IDLE_LV
    bit_range:
    - 3
    - 3
    description: This bit is used to control the output value when channel %s is inactive (when LEDC_SIG_OUT_EN_CH%s is 0).
  - name: PARA_UP
    bit_range:
    - 4
    - 4
    description: This bit is used to update LEDC_HPOINT_CH%s, LEDC_DUTY_START_CH%s, LEDC_SIG_OUT_EN_CH%s, LEDC_TIMER_SEL_CH%s, LEDC_DUTY_NUM_CH%s, LEDC_DUTY_CYCLE_CH%s, LEDC_DUTY_SCALE_CH%s, LEDC_DUTY_INC_CH%s, and LEDC_OVF_CNT_EN_CH%s fields for channel %s, and will be automatically cleared by hardware.
  - name: OVF_NUM
    bit_range:
    - 14
    - 5
    description: This register is used to configure the maximum times of overflow minus 1. The LEDC_OVF_CNT_CH%s_INT interrupt will be triggered when channel %s overflows for (LEDC_OVF_NUM_CH%s + 1) times.
  - name: OVF_CNT_EN
    bit_range:
    - 15
    - 15
    description: This bit is used to enable the ovf_cnt of channel %s.
  - name: OVF_CNT_RESET
    bit_range:
    - 16
    - 16
    description: Set this bit to reset the ovf_cnt of channel %s.
  side_effects: null
