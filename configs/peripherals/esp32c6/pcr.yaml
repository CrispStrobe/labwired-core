  - name: I2S_RX_CLKM_DIV_Y
    bit_range:
    - 17
    - 9
    description: For b <= a/2, the value of I2S_RX_CLKM_DIV_Y is (a%b) . For b > a/2, the value of I2S_RX_CLKM_DIV_Y is (a%(a-b)).
  - name: I2S_RX_CLKM_DIV_X
