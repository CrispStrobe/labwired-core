# LabWired - STM32H735VG smoke system configuration
#
# Referenced by firmware_survival::test_stm32h735_tier1_survival, which runs the
# committed Tier-1 fixture (tests/fixtures/tier1/stm32h735.elf) and asserts its
# TIER1 self-test transcript over UART.
name: "stm32h735-smoke"
chip: "../chips/stm32h735.yaml"
external_devices: []
board_io:
  # PA5 is briefly driven high/low by the fixture's gpio self-test.
  - id: "led_pa5"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
