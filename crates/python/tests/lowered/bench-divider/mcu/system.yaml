name: "playground-board"
chip: "chip.yaml"
external_devices:
  []
board_io:
  - id: "led1"
    kind: "led"
    peripheral: "portd"
    pin: 2
    signal: "output"
    active_high: true
  - id: "led_d13"
    kind: "led"
    peripheral: "portb"
    pin: 5
    signal: "output"
    active_high: true
cosim_models:
  - id: "circuit"
    adapter: "analog"
    step_ns: 100000
    inputs: {}
    outputs: {}
    config:
      vdd: 5.0
      netlist_text: |
        Vdd v_net_mcu_5v 0 dc 5.0
        RR1 v_net_mcu_5v v_net_dmm_v 10k
        RR2 v_net_dmm_v 0 10k
        Rdmm_dmm v_net_dmm_v 0 10000000
      probes:
        dmm_vdc_p_dmm: "v(v_net_dmm_v)"
      sources: {}
