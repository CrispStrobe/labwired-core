name: "playground-board"
chip: "chip.yaml"
external_devices:
  []
board_io:
  - id: "led_ld4"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
  - id: "button_b1"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: false
